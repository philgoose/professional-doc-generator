        // ═══════════════════════════════════════════════════════════════
        // 🔧 CUSTOM HOOKS

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error('LocalStorage 읽기 오류:', error);
                    return initialValue;
                }
            });
            const setValue = useCallback((value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error('LocalStorage 쓰기 오류:', error);
                }
            }, [key, storedValue]);
            return [storedValue, setValue];
        };

        const useKeyboardShortcut = (callback, keys) => {
            useEffect(() => {
                const handleKeyPress = (e) => {
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const modifierKey = isMac ? e.metaKey : e.ctrlKey;
                    if (modifierKey && keys.includes(e.key.toLowerCase())) {
                        e.preventDefault();
                        callback();
                    }
                };
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, [callback, keys]);
        };

        const useAutoSave = (data, callback, delay = AUTOSAVE_INTERVAL) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    callback(data);
                }, delay);
                return () => clearTimeout(timer);
            }, [data, callback, delay]);
        };

        // ═══════════════════════════════════════════════════════════════
        // 🔧 UTILITY FUNCTIONS (개선됨)
        // ═══════════════════════════════════════════════════════════════
        /**
         * 마크다운 테이블 파서 - 투자 리포트 테이블(파이프 없이도 인식) 완벽 지원
         */
        const parseMarkdownTable = (text) => {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const tables = [];
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];
                // 테이블 감지: | 가 3개 이상 포함된 줄
                if (line.includes('|') && (line.match(/\|/g) || []).length >= 3) {
                    let j = i;
                    const tableLines = [];

                    while (j < lines.length) {
                        const l = lines[j];
                        if (l.includes('|') && (l.match(/\|/g) || []).length >= 3) {
                            tableLines.push(l);
                            j++;
                        } else {
                            break;
                        }
                    }

                    if (tableLines.length >= 2) {
                        let headers = tableLines[0].split('|').map(c => c.trim()).filter(Boolean);
                        let rowStart = 1;

                        // 구분선(---) 스킵
                        if (tableLines[1] && tableLines[1].match(/^[\s|:-]+$/)) {
                            rowStart = 2;
                        }

                        const rows = tableLines.slice(rowStart).map(row =>
                            row.split('|').map(c => c.trim()).filter(Boolean)
                        ).filter(row => row.length > 0 && row.length === headers.length);

                        if (headers.length > 0) {
                            tables.push({ headers, rows });
                        }
                    }
                    i = j;
                    continue;
                }
                i++;
            }
            return tables;
        };

        /**
         * 증권 보고서용 컨텐츠 렌더러 (테이블 자동 인식 + 개선된 분리 로직)
         */
        const SecuritiesContentRenderer = ({ content }) => {
            const tables = parseMarkdownTable(content);
            const lines = content.split('\n');
            const parts = [];
            let lastIndex = 0;
            let lineIndex = 0;

            while (lineIndex < lines.length) {
                const trimmed = lines[lineIndex].trim();

                // 개선된 테이블 감지
                if (trimmed.includes('|') && (trimmed.match(/\|/g) || []).length >= 3) {
                    const tableStart = lineIndex;
                    let tableEnd = lineIndex + 1;

                    while (tableEnd < lines.length) {
                        const nextTrim = lines[tableEnd].trim();
                        if (nextTrim.includes('|') && (nextTrim.match(/\|/g) || []).length >= 3) {
                            tableEnd++;
                        } else {
                            break;
                        }
                    }

                    // 테이블 이전 텍스트
                    if (tableStart > lastIndex) {
                        parts.push({
                            type: 'text',
                            content: lines.slice(lastIndex, tableStart).join('\n')
                        });
                    }

                    // 테이블 파싱
                    const tableText = lines.slice(tableStart, tableEnd).join('\n');
                    const parsedTables = parseMarkdownTable(tableText);
                    if (parsedTables.length > 0) {
                        parts.push({
                            type: 'table',
                            data: parsedTables[0]
                        });
                    }

                    lastIndex = tableEnd;
                    lineIndex = tableEnd;
                } else {
                    lineIndex++;
                }
            }

            // 마지막 남은 텍스트
            if (lastIndex < lines.length) {
                parts.push({
                    type: 'text',
                    content: lines.slice(lastIndex).join('\n')
                });
            }

            return (
                <div>
                    {parts.map((part, idx) => {
                        if (part.type === 'text') {
                            return <div key={idx} className="whitespace-pre-wrap mb-4 text-gray-800 leading-relaxed">{part.content}</div>;
                        } else {
                            return (
                                <div key={idx} className="my-6 overflow-x-auto">
                                    <table className="w-full border-collapse border-2 border-gray-300">
                                        <thead>
                                            <tr className="bg-red-600 text-white">
                                                {part.data.headers.map((header, i) => (
                                                    <th key={i} className="border border-gray-300 px-4 py-3 text-left font-bold text-sm">
                                                        {header}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {part.data.rows.map((row, i) => (
                                                <tr key={i} className={i % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                                                    {row.map((cell, j) => (
                                                        <td key={j} className="border border-gray-300 px-4 py-2 text-sm">
                                                            {cell}
                                                        </td>
                                                    ))}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            );
                        }
                    })}
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════
        // 📝 MARKDOWN RENDERER (일반 문서용)
        // ═══════════════════════════════════════════════════════════════
        const escapeHtml = (str) =>
            str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        const renderInline = (text) => {
            let out = escapeHtml(text);
            out = out.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
            out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
            out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
            return out;
        };

        const renderMarkdown = (text) => {
            if (!text) return '';
            const lines = text.split('\n');
            const html = [];
            let i = 0;
            let inList = null; // 'ul' | 'ol'

            const closeList = () => {
                if (inList) { html.push(`</${inList}>`); inList = null; }
            };

            while (i < lines.length) {
                const line = lines[i];
                const trimmed = line.trim();

                // Code block
                if (trimmed.startsWith('```')) {
                    closeList();
                    const lang = trimmed.slice(3);
                    const buf = [];
                    i++;
                    while (i < lines.length && !lines[i].trim().startsWith('```')) {
                        buf.push(escapeHtml(lines[i]));
                        i++;
                    }
                    i++;
                    html.push(`<pre><code class="lang-${escapeHtml(lang)}">${buf.join('\n')}</code></pre>`);
                    continue;
                }

                // Table (pipe-delimited, at least one |)
                if (trimmed.includes('|') && (trimmed.match(/\|/g) || []).length >= 1 && trimmed.length > 0 && !trimmed.startsWith('#')) {
                    // collect contiguous table rows
                    const buf = [];
                    let j = i;
                    while (j < lines.length) {
                        const t = lines[j].trim();
                        if (t.length === 0) break;
                        if (!t.includes('|')) break;
                        if (t.startsWith('#') || t.startsWith('-') || t.startsWith('*')) break;
                        buf.push(t);
                        j++;
                    }
                    if (buf.length >= 2) {
                        closeList();
                        const splitRow = (r) => r.split('|').map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === '') && !(idx === arr.length - 1 && c === ''));
                        const headers = splitRow(buf[0]);
                        let start = 1;
                        if (buf[1] && /^[\s|:-]+$/.test(buf[1])) start = 2;
                        const rows = buf.slice(start).map(splitRow).filter(r => r.length > 0);
                        if (headers.length > 0 && rows.length > 0) {
                            html.push('<table>');
                            html.push('<thead><tr>');
                            headers.forEach(h => html.push(`<th>${renderInline(h)}</th>`));
                            html.push('</tr></thead>');
                            html.push('<tbody>');
                            rows.forEach(r => {
                                html.push('<tr>');
                                for (let k = 0; k < headers.length; k++) {
                                    html.push(`<td>${renderInline(r[k] || '')}</td>`);
                                }
                                html.push('</tr>');
                            });
                            html.push('</tbody></table>');
                            i = j;
                            continue;
                        }
                    }
                }

                // Headings
                const hMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
                if (hMatch) {
                    closeList();
                    const level = hMatch[1].length;
                    html.push(`<h${level}>${renderInline(hMatch[2])}</h${level}>`);
                    i++;
                    continue;
                }

                // Horizontal rule
                if (/^[-*_]{3,}$/.test(trimmed)) {
                    closeList();
                    html.push('<hr/>');
                    i++;
                    continue;
                }

                // Blockquote
                if (trimmed.startsWith('> ')) {
                    closeList();
                    const buf = [];
                    while (i < lines.length && lines[i].trim().startsWith('> ')) {
                        buf.push(lines[i].trim().slice(2));
                        i++;
                    }
                    html.push(`<blockquote>${renderInline(buf.join(' '))}</blockquote>`);
                    continue;
                }

                // Ordered list
                const olMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
                if (olMatch) {
                    if (inList !== 'ol') { closeList(); html.push('<ol>'); inList = 'ol'; }
                    html.push(`<li>${renderInline(olMatch[2])}</li>`);
                    i++;
                    continue;
                }

                // Unordered list
                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (inList !== 'ul') { closeList(); html.push('<ul>'); inList = 'ul'; }
                    html.push(`<li>${renderInline(trimmed.slice(2))}</li>`);
                    i++;
                    continue;
                }

                // Empty line
                if (trimmed.length === 0) {
                    closeList();
                    i++;
                    continue;
                }

                // Paragraph
                closeList();
                html.push(`<p>${renderInline(trimmed)}</p>`);
                i++;
            }
            closeList();
            return html.join('\n');
        };

        const MarkdownRenderer = ({ content }) => (
            <div className="md-render" dangerouslySetInnerHTML={{ __html: renderMarkdown(content || '') }} />
        );

        // ═══════════════════════════════════════════════════════════════
        // 📦 STATE MANAGEMENT
        // ═══════════════════════════════════════════════════════════════
        const initialState = {
            documents: [],

        };

        const actionTypes = {
            CREATE_DOCUMENT: 'CREATE_DOCUMENT',
            UPDATE_DOCUMENT: 'UPDATE_DOCUMENT',
            DELETE_DOCUMENT: 'DELETE_DOCUMENT',
            DUPLICATE_DOCUMENT: 'DUPLICATE_DOCUMENT',
            SELECT_DOCUMENT: 'SELECT_DOCUMENT',
            LOAD_DOCUMENTS: 'LOAD_DOCUMENTS'
        };

        function documentReducer(state, action) {
            switch (action.type) {
                case actionTypes.CREATE_DOCUMENT:
                    const newDoc = {
                        id: Date.now().toString(),
                        templateId: action.payload.templateId,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        data: TEMPLATES[action.payload.templateId].isSecurities ? {
                            company: '기업명',
                            title: TEMPLATES[action.payload.templateId].name,
                            content: TEMPLATES[action.payload.templateId].defaultContent,
                            author: '임채훈 수석 애널리스트',
                            rating: 'BUY',
                            target_price: '85,000',
                            current_price: '68,500',
                            ...action.payload.initialData
                        } : {
                            organization: '한국기술교육원',
                            recipient: '수신자',
                            title: TEMPLATES[action.payload.templateId].name,
                            content: TEMPLATES[action.payload.templateId].defaultContent,
                            author: '임채훈 원장',
                            ...action.payload.initialData
                        }
                    };
                    return {
                        ...state,
                        documents: [...state.documents, newDoc],
                        currentDocId: newDoc.id
                    };
                case actionTypes.UPDATE_DOCUMENT:
                    return {
                        ...state,
                        documents: state.documents.map(doc =>
                            doc.id === action.payload.id
                                ? { ...doc, data: { ...doc.data, ...action.payload.updates }, updatedAt: new Date().toISOString() }
                                : doc
                        ),
                        lastSaved: new Date()
                    };
                case actionTypes.DELETE_DOCUMENT:
                    const remainingDocs = state.documents.filter(doc => doc.id !== action.payload.id);
                    return {
                        ...state,
                        documents: remainingDocs,
                        currentDocId: remainingDocs.length > 0 ? remainingDocs[0].id : null
                    };
                case actionTypes.DUPLICATE_DOCUMENT: {
                    const source = state.documents.find(d => d.id === action.payload.id);
                    if (!source) return state;
                    const copy = {
                        ...source,
                        id: Date.now().toString(),
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        data: { ...source.data, title: `${source.data.title} (사본)` }
                    };
                    return {
                        ...state,
                        documents: [...state.documents, copy],
                        currentDocId: copy.id
                    };
                }
                case actionTypes.SELECT_DOCUMENT:
                    return {
                        ...state,
                        currentDocId: action.payload.id
                    };
                case actionTypes.LOAD_DOCUMENTS:
                    return {
                        ...state,
                        documents: action.payload.documents,
                        currentDocId: action.payload.documents.length > 0 ? action.payload.documents[0].id : null
                    };
                default:
                    return state;
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // 🎨 UI COMPONENTS
        // ═══════════════════════════════════════════════════════════════
        const Toast = ({ message, onClose }) => {

        const FieldInput = ({ label, value, onChange, type = 'text', placeholder, markdownToolbar = false }) => {
            const textareaRef = useRef(null);
            const wrap = useCallback((prefix, suffix = prefix, defaultText = '') => {
                const el = textareaRef.current;
                if (!el) return;
                const start = el.selectionStart;
                const end = el.selectionEnd;
                const selected = value.slice(start, end) || defaultText;
                const next = value.slice(0, start) + prefix + selected + suffix + value.slice(end);
                onChange(next);
                requestAnimationFrame(() => {
                    el.focus();
                    const pos = start + prefix.length + selected.length;
                    el.setSelectionRange(pos, pos);
                });
            }, [value, onChange]);
            const insertLine = useCallback((line) => {
                const el = textareaRef.current;
                if (!el) return;
                const start = el.selectionStart;
                const before = value.slice(0, start);
                const needsNewline = before.length > 0 && !before.endsWith('\n');
                const prefix = needsNewline ? '\n' : '';
                const next = before + prefix + line + '\n' + value.slice(start);
                onChange(next);
                requestAnimationFrame(() => {
                    el.focus();
                    const pos = start + prefix.length + line.length + 1;
                    el.setSelectionRange(pos, pos);
                });
            }, [value, onChange]);

            const btn = "px-2 py-1 text-[10px] bg-[#151b24] hover:bg-[#22d3ee] hover:text-[#0a0e14] text-gray-400 border border-[#22d3ee]/20 rounded transition-colors mono";

            return (
                <div className="space-y-1">

                    {type === 'textarea' ? (
                        <>
                            {markdownToolbar && (
                                <div className="flex flex-wrap gap-1 mb-1">
                                    <button type="button" className={btn} onClick={() => insertLine('## 제목')} title="H2">H2</button>
                                    <button type="button" className={btn} onClick={() => insertLine('### 소제목')} title="H3">H3</button>
                                    <button type="button" className={btn} onClick={() => wrap('**', '**', '굵게')} title="Bold"><b>B</b></button>
                                    <button type="button" className={btn} onClick={() => wrap('*', '*', '기울임')} title="Italic"><i>I</i></button>
                                    <button type="button" className={btn} onClick={() => insertLine('- 항목')} title="List">• List</button>
                                    <button type="button" className={btn} onClick={() => insertLine('1. 항목')} title="Numbered">1. List</button>
                                    <button type="button" className={btn} onClick={() => wrap('`', '`', 'code')} title="Inline code">{`{ }`}</button>
                                    <button type="button" className={btn} onClick={() => insertLine('```\ncode\n```')} title="Code block">▤</button>
                                    <button type="button" className={btn} onClick={() => insertLine('> 인용문')} title="Quote">❝</button>
                                    <button type="button" className={btn} onClick={() => insertLine('구분 | 값 | 비고\n---|---|---\n항목1 | 100 | 메모')} title="Table">▦</button>
                                </div>
                            )}
                            <textarea
                                ref={textareaRef}
                                className="w-full bg-[#0a0e14] border border-[#22d3ee]/30 rounded-lg p-3 text-sm text-gray-200 focus:border-[#22d3ee] focus:ring-1 focus:ring-[#22d3ee] outline-none transition-all resize-none mono"
                                rows="12"
                                value={value}
                                onChange={(e) => onChange(e.target.value)}
                                placeholder={placeholder}
                            />
                        </>
                    ) : (
                        <input
                            type={type}
                            className="w-full bg-[#0a0e14] border border-[#22d3ee]/30 rounded-lg p-3 text-sm text-gray-200 focus:border-[#22d3ee] focus:ring-1 focus:ring-[#22d3ee] outline-none transition-all mono"
                            value={value}
                            onChange={(e) => onChange(e.target.value)}
                            placeholder={placeholder}
                        />
                    )}
                </div>
            );
        };

        // ═══════════════════════════════════════════════════════════════
        // 🏗️ MAIN APPLICATION (보완 완료)
        // ═══════════════════════════════════════════════════════════════
        const ProDocEngine = () => {
            const [state, dispatch] = useReducer(documentReducer, initialState);
            const [savedDocs, setSavedDocs] = useLocalStorage(STORAGE_KEY, []);
            const [theme, setTheme] = useLocalStorage('prodoc_theme', 'dark');
            const [toast, setToast] = useState(null);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('all');
            const canvasRef = useRef(null);
            const printRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                document.body.classList.toggle('theme-light', theme === 'light');
            }, [theme]);

            const toggleTheme = useCallback(() => {
                setTheme(t => t === 'dark' ? 'light' : 'dark');
            }, [setTheme]);

            // 초기 로드
            useEffect(() => {
                if (savedDocs.length > 0) {
                    dispatch({ type: actionTypes.LOAD_DOCUMENTS, payload: { documents: savedDocs } });
                } else {
                    dispatch({
                        type: actionTypes.CREATE_DOCUMENT,
                        payload: { templateId: 'LECTURE_CURRICULUM' }
                    });
                }
            }, []);

            // 자동 저장
            useAutoSave(state.documents, (docs) => {
                if (docs.length > 0) {
                    setSavedDocs(docs);
                }
            });

            const currentDoc = useMemo(() =>
                state.documents.find(doc => doc.id === state.currentDocId),
                [state.documents, state.currentDocId]
            );

            const currentTemplate = useMemo(() =>
                currentDoc ? TEMPLATES[currentDoc.templateId] : null,
                [currentDoc]
            );

            const updateField = useCallback((field, value) => {
                if (!currentDoc) return;
                dispatch({
                    type: actionTypes.UPDATE_DOCUMENT,
                    payload: {
                        id: currentDoc.id,
                        updates: { [field]: value }
                    }
                });
            }, [currentDoc]);

            const createNewDocument = useCallback((templateId) => {
                dispatch({ type: actionTypes.CREATE_DOCUMENT, payload: { templateId } });
                setToast('✅ 새 문서가 생성되었습니다');
            }, []);

            const deleteDocument = useCallback((id) => {
                if (state.documents.length === 1) {
                    setToast('⚠️ 마지막 문서는 삭제할 수 없습니다');
                    return;
                }
                dispatch({ type: actionTypes.DELETE_DOCUMENT, payload: { id } });
                setToast('🗑️ 문서가 삭제되었습니다');
            }, [state.documents.length]);

            const duplicateDocument = useCallback((id) => {
                if (!id) return;
                dispatch({ type: actionTypes.DUPLICATE_DOCUMENT, payload: { id } });
                setToast('📑 문서가 복제되었습니다');
            }, []);

            const filteredDocs = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                return state.documents.filter(d => {
                    const tmpl = TEMPLATES[d.templateId];
                    if (categoryFilter !== 'all' && tmpl?.category !== categoryFilter) return false;
                    if (!q) return true;
                    return (d.data.title || '').toLowerCase().includes(q)
                        || (d.data.content || '').toLowerCase().includes(q)
                        || (tmpl?.name || '').toLowerCase().includes(q);
                });
            }, [state.documents, searchQuery, categoryFilter]);

            const availableCategories = useMemo(() => {
                const set = new Set(state.documents.map(d => TEMPLATES[d.templateId]?.category).filter(Boolean));
                return ['all', ...Array.from(set)];
            }, [state.documents]);

            const { wordCount, charCount } = useMemo(() => {
                const text = currentDoc?.data?.content || '';
                return {
                    wordCount: text.trim() ? text.trim().split(/\s+/).length : 0,
                    charCount: text.length
                };
            }, [currentDoc]);

            // PDF 내보내기
            const exportToPDF = useCallback(() => {
                if (!printRef.current) return;
                setToast('📄 PDF 생성 중...');
                const element = printRef.current;
                const opt = {
                    margin: 0,
                    filename: `${currentDoc.data.title || 'document'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save().then(() => {
                    setToast('🎉 PDF 다운로드 완료');
                }).catch(err => {
                    console.error('PDF export error:', err);
                    setToast('❌ PDF 생성 중 오류');
                });
            }, [currentDoc]);

            // 인장 렌더링 (커스터마이징 가능)
            const sealName = currentDoc?.data?.seal_name || '임채훈';
            const sealTitle = currentDoc?.data?.seal_title || 'DIRECTOR';
            const renderSeal = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                canvas.width = 200 * dpr;
                canvas.height = 200 * dpr;
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, 200, 200);

                // 외곽 원 (더 두껍고 선명)
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(100, 100, 78, 0, Math.PI * 2);
                ctx.stroke();

                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(100, 100, 68, 0, Math.PI * 2);
                ctx.stroke();

                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(100, 100, 55, 0, Math.PI * 2);
                ctx.stroke();

                // 텍스트
                ctx.fillStyle = '#dc2626';
                ctx.textAlign = 'center';
                ctx.font = 'bold 14px JetBrains Mono';
                ctx.fillText((sealTitle || '').toUpperCase().slice(0, 12), 100, 78);
                const nameChars = (sealName || '').trim();
                const nameFontSize = nameChars.length <= 3 ? 32 : nameChars.length <= 4 ? 26 : 22;
                ctx.font = `bold ${nameFontSize}px serif`;
                ctx.fillText(nameChars.slice(0, 6), 100, 118);
                ctx.font = 'bold 12px JetBrains Mono';
                ctx.fillText('印', 100, 140);
            }, [sealName, sealTitle]);

            useEffect(() => { renderSeal(); }, [renderSeal]);

            // 단축키
            useKeyboardShortcut(() => {
                setSavedDocs(state.documents);
                setToast('💾 수동 저장 완료');
            }, ['s']);

            useKeyboardShortcut(() => {
                window.print();
            }, ['p']);

            useKeyboardShortcut(() => {
                if (currentDoc) duplicateDocument(currentDoc.id);
            }, ['d']);

            useKeyboardShortcut(() => {
                toggleTheme();
            }, ['j']);

            if (!currentDoc) {
                return (
                    <div className="flex items-center justify-center h-screen">
                        <div className="text-center">
                            <div className="text-6xl mb-4">📄</div>
                            <p className="text-gray-400">문서를 생성하세요</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen w-full overflow-hidden grid-bg">
                    {/* 사이드바 */}
                    <aside className={`${sidebarCollapsed ? 'w-16' : 'w-[420px]'} bg-[#0a0e14] border-r border-[#22d3ee]/20 flex flex-col transition-all duration-300 no-print`}>
                        <div className="p-6 border-b border-[#22d3ee]/20">
                            <div className="flex items-center justify-between mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 rounded-full bg-[#22d3ee] shadow-[0_0_10px_rgba(34,211,238,0.5)]" />
                                    {!sidebarCollapsed && (
                                        <div>
                                            <h1 className="font-black text-[#22d3ee] tracking-tight display text-lg">PRODOC</h1>
                                            <p className="text-[9px] text-gray-500 mono">Enterprise v3.1</p>
                                        </div>
                                    )}
                                </div>
                                <div className="flex items-center gap-2">
                                    {!sidebarCollapsed && (
                                        <button
                                            onClick={toggleTheme}
                                            title="테마 전환 (Ctrl+J)"
                                            className="text-gray-400 hover:text-[#22d3ee] transition-colors text-sm"
                                        >
                                            {theme === 'dark' ? '☀️' : '🌙'}
                                        </button>
                                    )}
                                    <button
                                        onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                                        className="text-gray-400 hover:text-[#22d3ee] transition-colors"
                                    >
                                        {sidebarCollapsed ? '→' : '←'}
                                    </button>
                                </div>
                            </div>
                            {!sidebarCollapsed && (
                                <select
                                    className="w-full bg-[#151b24] border border-[#22d3ee]/30 rounded-lg p-2.5 text-xs text-gray-200 focus:border-[#22d3ee] outline-none mono"
                                    onChange={(e) => createNewDocument(e.target.value)}
                                    value=""
                                >
                                    <option value="" disabled>+ 새 문서 생성</option>
                                    {Object.entries(TEMPLATES).map(([key, tmpl]) => (
                                        <option key={key} value={key}>
                                            {tmpl.icon} {tmpl.name}
                                        </option>
                                    ))}
                                </select>
                            )}
                        </div>

                        {!sidebarCollapsed && (
                            <>
                                {/* 문서 목록 */}
                                <div className="px-4 py-3 border-b border-[#22d3ee]/20">
                                    <div className="flex items-center justify-between mb-2">
                                        <p className="text-[9px] font-bold text-gray-500 uppercase tracking-wider mono">
                                            문서 목록 ({filteredDocs.length}/{state.documents.length})
                                        </p>
                                    </div>
                                    <input
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="🔎 제목·내용·종류 검색..."
                                        className="w-full bg-[#0a0e14] border border-[#22d3ee]/20 rounded-md px-2 py-1.5 text-[11px] text-gray-200 placeholder-gray-600 focus:border-[#22d3ee] outline-none mb-2 mono"
                                    />
                                    <div className="flex flex-wrap gap-1 mb-2">
                                        {availableCategories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setCategoryFilter(cat)}
                                                className={`px-2 py-0.5 text-[9px] mono rounded-full border transition-colors ${
                                                    categoryFilter === cat
                                                        ? 'bg-[#22d3ee] text-[#0a0e14] border-[#22d3ee]'
                                                        : 'bg-transparent text-gray-400 border-[#22d3ee]/20 hover:border-[#22d3ee]/60'
                                                }`}
                                            >
                                                {cat === 'all' ? '전체' : cat}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="space-y-1 max-h-32 overflow-y-auto">
                                        {filteredDocs.length === 0 ? (
                                            <p className="text-[10px] text-gray-600 mono text-center py-3">검색 결과 없음</p>
                                        ) : filteredDocs.map((doc) => (
                                            <div
                                                key={doc.id}
                                                className={`flex items-center justify-between p-2 rounded-lg cursor-pointer transition-all ${
                                                    doc.id === currentDoc.id
                                                        ? 'bg-[#22d3ee]/10 border border-[#22d3ee]/30'
                                                        : 'hover:bg-[#151b24]'
                                                }`}
                                                onClick={() => dispatch({ type: actionTypes.SELECT_DOCUMENT, payload: { id: doc.id } })}
                                            >
                                                <div className="flex items-center gap-2 min-w-0">
                                                    <span className="text-sm">{TEMPLATES[doc.templateId].icon}</span>
                                                    <div className="min-w-0">
                                                        <p className="text-xs text-gray-200 mono truncate max-w-[180px]">
                                                            {doc.data.title}
                                                        </p>
                                                        <p className="text-[9px] text-gray-500 mono">
                                                            {new Date(doc.updatedAt).toLocaleDateString('ko-KR')}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0">
                                                    <button
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            duplicateDocument(doc.id);
                                                        }}
                                                        title="복제 (Ctrl+D)"
                                                        className="text-gray-500 hover:text-[#22d3ee] text-xs"
                                                    >
                                                        ⎘
                                                    </button>
                                                    {state.documents.length > 1 && (
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                deleteDocument(doc.id);
                                                            }}
                                                            className="text-gray-500 hover:text-red-400 text-xs"
                                                        >
                                                            ✕
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 편집 필드 */}
                                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                    <div className="gradient-border rounded-lg p-4 mb-4">
                                        <p className="text-[10px] text-[#22d3ee] font-bold mono mb-2">
                                            📋 {currentTemplate?.name}
                                        </p>
                                        <p className="text-[9px] text-gray-500 mono">
                                            {currentTemplate?.category.toUpperCase()}
                                        </p>
                                    </div>

                                    {currentTemplate?.isSecurities ? (
                                        /* 증권 보고서 전용 필드 */
                                        <>
                                            <FieldInput label="기업명" value={currentDoc.data.company || ''} onChange={(v) => updateField('company', v)} placeholder="예: 삼성전자" />
                                            <FieldInput label="리포트 제목" value={currentDoc.data.title || ''} onChange={(v) => updateField('title', v)} placeholder="예: AI 반도체 슈퍼사이클 진입" />
                                            <div className="grid grid-cols-2 gap-3">
                                                <FieldInput label="투자의견" value={currentDoc.data.rating || ''} onChange={(v) => updateField('rating', v)} placeholder="BUY/HOLD/SELL" />
                                                <FieldInput label="목표주가" value={currentDoc.data.target_price || ''} onChange={(v) => updateField('target_price', v)} placeholder="85,000" />
                                            </div>
                                            <FieldInput label="현재주가" value={currentDoc.data.current_price || ''} onChange={(v) => updateField('current_price', v)} placeholder="68,500" />
                                            <FieldInput label="분석 내용" type="textarea" markdownToolbar value={currentDoc.data.content || ''} onChange={(v) => updateField('content', v)} placeholder="투자 의견, 재무 분석, 리스크 요인 등을 작성하세요..." />
                                            <FieldInput label="애널리스트" value={currentDoc.data.author || ''} onChange={(v) => updateField('author', v)} placeholder="예: 임채훈 수석 애널리스트" />
                                        </>
                                    ) : (
                                        /* 일반 문서 필드 */
                                        <>
                                            <FieldInput label="조직/기관명" value={currentDoc.data.organization || ''} onChange={(v) => updateField('organization', v)} placeholder="예: 한국기술교육원" />
                                            <FieldInput label="수신자" value={currentDoc.data.recipient || ''} onChange={(v) => updateField('recipient', v)} placeholder="예: 홍길동 책임연구원" />
                                            <FieldInput label="문서 제목" value={currentDoc.data.title || ''} onChange={(v) => updateField('title', v)} placeholder="예: 2025년 상반기 교육과정 안내" />
                                            <FieldInput label="본문 내용" type="textarea" markdownToolbar value={currentDoc.data.content || ''} onChange={(v) => updateField('content', v)} placeholder="본문 내용을 입력하세요..." />
                                            <FieldInput label="발신자 (서명)" value={currentDoc.data.author || ''} onChange={(v) => updateField('author', v)} placeholder="예: 임채훈 원장" />
                                            <div className="grid grid-cols-2 gap-3">
                                                <FieldInput label="인장 이름" value={currentDoc.data.seal_name || ''} onChange={(v) => updateField('seal_name', v)} placeholder="임채훈" />
                                                <FieldInput label="인장 직함" value={currentDoc.data.seal_title || ''} onChange={(v) => updateField('seal_title', v)} placeholder="DIRECTOR" />
                                            </div>
                                        </>
                                    )}
                                </div>

                                {/* 액션 버튼 */}
                                <div className="p-6 border-t border-[#22d3ee]/20 space-y-2">
                                    <button
                                        onClick={exportToPDF}
                                        className="w-full bg-gradient-to-r from-[#22d3ee] to-[#06b6d4] hover:from-[#06b6d4] hover:to-[#0891b2] text-[#0a0e14] font-bold py-3 px-4 rounded-lg transition-all transform active:scale-[0.98] neo-glow mono text-sm"
                                    >
                                        📄 PDF 내보내기 (Library)
                                    </button>
                                    <button
                                        onClick={() => window.print()}
                                        className="w-full bg-[#151b24] hover:bg-[#1f2937] text-[#22d3ee] font-bold py-2 px-4 rounded-lg border border-[#22d3ee]/30 transition-all mono text-xs"
                                    >
                                        🖨️ 인쇄 / PDF 저장 (Ctrl+P)
                                    </button>

                                    <div className="grid grid-cols-4 gap-2">
                                        <button
                                            onClick={() => {
                                                const payload = { __prodoc: '1', templateId: currentDoc.templateId, data: currentDoc.data };
                                                const dataStr = JSON.stringify(payload, null, 2);
                                                const blob = new Blob([dataStr], { type: 'application/json' });
                                                const url = URL.createObjectURL(blob);
                                                const a = document.createElement('a');
                                                a.href = url;
                                                a.download = `${currentDoc.data.title || 'document'}.json`;
                                                a.click();
                                                setToast('📦 JSON 내보내기 완료');
                                            }}
                                            className="bg-[#151b24] hover:bg-[#1f2937] text-[#22d3ee] font-bold py-2 px-3 rounded-lg border border-[#22d3ee]/30 transition-all mono text-xs"
                                        >
                                            📦 JSON ↓
                                        </button>
                                        <button
                                            onClick={() => fileInputRef.current?.click()}
                                            className="bg-[#151b24] hover:bg-[#1f2937] text-[#22d3ee] font-bold py-2 px-3 rounded-lg border border-[#22d3ee]/30 transition-all mono text-xs"
                                        >
                                            📥 JSON ↑
                                        </button>
                                        <button
                                            onClick={() => {
                                                const textContent = `${currentDoc.data.title}\n\n${currentDoc.data.content}`;
                                                const blob = new Blob([textContent], { type: 'text/plain' });
                                                const url = URL.createObjectURL(blob);
                                                const a = document.createElement('a');
                                                a.href = url;
                                                a.download = `${currentDoc.data.title || 'document'}.txt`;
                                                a.click();
                                                setToast('📝 TXT 내보내기 완료');
                                            }}
                                            className="bg-[#151b24] hover:bg-[#1f2937] text-[#22d3ee] font-bold py-2 px-3 rounded-lg border border-[#22d3ee]/30 transition-all mono text-xs"
                                        >
                                            📝 TXT
                                        </button>
                                        <button
                                            onClick={() => {
                                                const html = `<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(currentDoc.data.title || 'document')}</title><style>body{font-family:'Crimson Pro',serif;max-width:800px;margin:2rem auto;padding:0 1rem;line-height:1.7;color:#111}h1{border-bottom:2px solid #333;padding-bottom:.4rem}h2{border-left:4px solid #2563eb;padding-left:.6rem}pre{background:#1f2937;color:#f3f4f6;padding:1rem;border-radius:6px;overflow-x:auto}code{background:#f3f4f6;color:#b91c1c;padding:.1rem .3rem;border-radius:3px}table{border-collapse:collapse;width:100%}th{background:#1f2937;color:#fff;padding:.5rem;border:1px solid #4b5563;text-align:left}td{padding:.5rem;border:1px solid #d1d5db}blockquote{border-left:4px solid #9ca3af;padding-left:1rem;color:#4b5563;font-style:italic}</style></head><body><h1>${escapeHtml(currentDoc.data.title || '')}</h1>${renderMarkdown(currentDoc.data.content || '')}</body></html>`;
                                                const blob = new Blob([html], { type: 'text/html' });
                                                const url = URL.createObjectURL(blob);
                                                const a = document.createElement('a');
                                                a.href = url;
                                                a.download = `${currentDoc.data.title || 'document'}.html`;
                                                a.click();
                                                setToast('🌐 HTML 내보내기 완료');
                                            }}
                                            className="bg-[#151b24] hover:bg-[#1f2937] text-[#22d3ee] font-bold py-2 px-3 rounded-lg border border-[#22d3ee]/30 transition-all mono text-xs"
                                        >
                                            🌐 HTML
                                        </button>
                                    </div>
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        accept="application/json,.json"
                                        className="hidden"
                                        onChange={(e) => {
                                            const file = e.target.files?.[0];
                                            if (!file) return;
                                            const reader = new FileReader();
                                            reader.onload = (ev) => {
                                                try {
                                                    const parsed = JSON.parse(ev.target.result);
                                                    const templateId = (parsed.templateId && TEMPLATES[parsed.templateId]) ? parsed.templateId : currentDoc.templateId;
                                                    const data = parsed.data || parsed;
                                                    dispatch({ type: actionTypes.CREATE_DOCUMENT, payload: { templateId, initialData: data } });
                                                    setToast('📥 JSON 가져오기 완료');
                                                } catch (err) {
                                                    setToast('❌ JSON 형식 오류');
                                                }
                                                e.target.value = '';
                                            };
                                            reader.readAsText(file);
                                        }}
                                    />

                                    <button
                                        onClick={() => {
                                            setSavedDocs(state.documents);
                                            setToast('💾 모든 문서 저장 완료');
                                        }}

                                    </button>

                                    {/* Quick Templates */}
                                    <div className="border-t border-[#22d3ee]/20 pt-3 mt-3">
                                        <div className="flex items-center justify-between mb-2">
                                            <p className="text-[9px] text-gray-500 uppercase tracking-wider mono">Quick Templates</p>
                                            <p className="text-[8px] text-gray-600 mono">⌘S 저장 · ⌘D 복제 · ⌘J 테마</p>
                                        </div>
                                        <div className="grid grid-cols-4 gap-1">
                                            {Object.entries(TEMPLATES).map(([key, tmpl]) => (
                                                <button
                                                    key={key}
                                                    onClick={() => createNewDocument(key)}
                                                    className="aspect-square flex flex-col items-center justify-center bg-[#0a0e14] hover:bg-[#151b24] border border-[#22d3ee]/20 hover:border-[#22d3ee]/50 rounded transition-all"

                                                    <span className="text-lg">{tmpl.icon}</span>

                                    </div>
                                </div>
                            </>
                        )}
                    </aside>

                    {/* 메인 프리뷰 */}
                    <main className={`flex-1 ${theme === 'light' ? 'bg-gray-200' : 'bg-[#0d1117]'} overflow-y-auto flex flex-col print-area transition-colors`}>
                        <div ref={printRef} className="flex-1 flex justify-center items-start p-12">
                            {currentTemplate?.isSecurities ? (
                                /* 한화투자증권 스타일 */

                                    <div className="bg-gradient-to-r from-red-700 to-red-600 px-12 py-8">

                                                <p className="text-red-100 text-[10px] mono">{new Date().toLocaleDateString('ko-KR')}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-gray-50 border-b-4 border-red-600 px-12 py-6">
                                        <div className="flex justify-between items-end">

                                                <p className="text-gray-600 text-sm font-semibold">{currentDoc.data.title}</p>
                                            </div>
                                            <div className="text-right">
                                                <div className="bg-red-600 text-white px-6 py-2 rounded-lg inline-block">
                                                    <p className="text-xs font-bold">투자의견</p>
                                                    <p className="text-2xl font-black">{currentDoc.data.rating || 'BUY'}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                        <div className="grid grid-cols-4 gap-6">
                                            <div className="border-l-4 border-red-600 pl-4">
                                                <p className="text-xs text-gray-500 font-semibold mb-1">목표주가</p>
                                                <p className="text-2xl font-black text-red-600">{currentDoc.data.target_price || '85,000'}원</p>
                                            </div>
                                            <div className="border-l-4 border-gray-300 pl-4">
                                                <p className="text-xs text-gray-500 font-semibold mb-1">현재주가</p>
                                                <p className="text-2xl font-black text-gray-700">{currentDoc.data.current_price || '68,500'}원</p>
                                            </div>

                                            </div>
                                        </div>
                                    </div>

                                    <article className="px-12 py-8">
                                        <div className="prose max-w-none">
                                            <div className="text-gray-800 leading-relaxed text-[15px]" style={{ fontFamily: "'Crimson Pro', serif" }}>
                                                <SecuritiesContentRenderer content={currentDoc.data.content} />
                                            </div>
                                        </div>
                                    </article>

                                    <div className="px-12 py-6 bg-gray-50 border-t-2 border-gray-200">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <p className="text-xs text-gray-500 mb-1">애널리스트</p>
                                                <p className="text-lg font-bold text-gray-900">{currentDoc.data.author}</p>
                                                <p className="text-xs text-gray-600 mono">research@hanwhawm.com</p>
                                            </div>
                                            <div className="text-right text-[10px] text-gray-500 mono">
                                                <p>Report ID: {currentDoc.id.substring(0, 8).toUpperCase()}</p>

                                            </div>
                                        </div>
                                    </div>

                                        </p>

                                                    <td className="px-6 py-4">{currentDoc.data.organization}</td>
                                                </tr>
                                                <tr>
                                                    <td className="font-bold bg-gray-100 px-6 py-4 text-gray-700 border-r-2 border-gray-800">제목</td>
                                                    <td className="px-6 py-4 font-bold text-base">{currentDoc.data.title}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>

                                    {/* 본문 */}
                                    <article className="px-12 mb-16">
                                        <div className="border-2 border-gray-300 rounded-lg p-8 bg-white min-h-[400px]">
                                            <div className="text-gray-800 leading-loose text-base">
                                                <MarkdownRenderer content={currentDoc.data.content} />
                                            </div>
                                        </div>
                                    </article>

                                    {/* 결재란 + 인장 (위치 개선) */}
                                    <div className="px-12 mb-12">
                                        <div className="border-2 border-gray-800">
                                            <div className="grid grid-cols-4 text-center">
                                                <div className="border-r-2 border-gray-800 py-3 bg-gray-100">
                                                    <p className="text-xs font-bold text-gray-600">담당</p>

                                                    <p className="text-xs font-bold text-gray-600">승인</p>
                                                </div>
                                                <div className="py-3 bg-gray-100">
                                                    <p className="text-xs font-bold text-gray-600">발신</p>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-4 text-center border-t-2 border-gray-800">
                                                <div className="border-r-2 border-gray-800 py-12"></div>
                                                <div className="border-r-2 border-gray-800 py-12"></div>
                                                <div className="border-r-2 border-gray-800 py-12"></div>
                                                {/* 인장 위치 개선: 결재란 내부 중앙 정렬 */}

                                        <div className="inline-block text-left">
                                            <p className="text-sm text-gray-600 mb-2">발신자</p>
                                            <div className="border-b-2 border-gray-800 pb-2 px-4">
                                                <p className="text-2xl font-bold tracking-tight">{currentDoc.data.author}</p>
                                            </div>
                                            <p className="text-xs text-gray-500 mt-1 text-right">(인)</p>
                                        </div>
                                    </div>

                                    {/* 푸터 */}
                                    <footer className="absolute bottom-6 left-0 right-0 px-12">
                                        <div className="border-t-2 border-gray-300 pt-4">
                                            <div className="grid grid-cols-3 gap-4 text-[10px] text-gray-500 mono">
                                                <div>
                                                    <p className="font-bold mb-1">문서검증번호</p>
                                                    <p>{currentDoc.id.substring(0, 16).toUpperCase()}</p>
                                                </div>
                                                <div className="text-center">
                                                    <p className="font-bold mb-1">발행시스템</p>
                                                    <p>ProDoc Enterprise v3.1</p>
                                                </div>
                                                <div className="text-right">
                                                    <p className="font-bold mb-1">발행일시</p>
                                                    <p>{new Date().toLocaleString('ko-KR')}</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-center text-[9px] text-gray-400 mt-3 mono">
                                            <p>이 문서는 전자문서 및 전자거래 기본법에 따라 법적 효력을 가집니다.</p>
                                        </div>
                                    </footer>
                                </section>
                            )}
                        </div>
                        <StatusBar status="saved" lastSaved={state.lastSaved} wordCount={wordCount} charCount={charCount} />
                    </main>

                    {toast && <Toast message={toast} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProDocEngine />);
    </script>
</body>
