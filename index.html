<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDoc Engine • Enterprise Document Automation</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Archivo+Black&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        @page { size: A4; margin: 0; }
        @media print {
            .no-print { display: none !important; }
            .print-area { padding: 0 !important; margin: 0 !important; }
            body { background: white !important; }
        }
       
        * { margin: 0; padding: 0; box-sizing: border-box; }
       
        body {
            background: #0a0e14;
            color: #d4d4d4;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }
        .neo-glow {
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
        }
        .gradient-border {
            position: relative;
            background: linear-gradient(135deg, #0a0e14 0%, #151b24 100%);
        }
       
        .gradient-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, #22d3ee, #8b5cf6);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }
        .document-canvas {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            color: #1a1a1a;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            font-family: 'Crimson Pro', serif;
            border: 1px solid #e5e7eb;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .display { font-family: 'Archivo Black', sans-serif; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(34, 211, 238, 0.95);
            color: #0a0e14;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            animation: slideIn 0.3s ease-out;
            z-index: 9999;
        }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
            50% { box-shadow: 0 0 40px rgba(34, 211, 238, 0.6); }
        }
        .status-indicator {
            animation: pulse-glow 2s infinite;
        }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0e14; }
        ::-webkit-scrollbar-thumb { background: #22d3ee; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
        /* 선택 텍스트 */
        ::selection { background: #22d3ee; color: #0a0e14; }
        .grid-bg {
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* ═══ Markdown Body Styling ═══ */
        .md-body { font-family: 'Crimson Pro', serif; color: #1f2937; line-height: 1.85; font-size: 15px; }
        .md-body h1 { font-family: 'Archivo Black', sans-serif; font-size: 28px; margin: 24px 0 12px; color: #0f172a; border-bottom: 3px solid #1e40af; padding-bottom: 8px; letter-spacing: -0.02em; }
        .md-body h2 { font-family: 'Archivo Black', sans-serif; font-size: 22px; margin: 22px 0 10px; color: #1e3a8a; border-left: 5px solid #1e40af; padding-left: 12px; letter-spacing: -0.01em; }
        .md-body h3 { font-weight: 800; font-size: 17px; margin: 18px 0 8px; color: #1e3a8a; }
        .md-body h4 { font-weight: 700; font-size: 15px; margin: 14px 0 6px; color: #334155; }
        .md-body p { margin: 8px 0; }
        .md-body strong { font-weight: 700; color: #0f172a; }
        .md-body em { font-style: italic; color: #475569; }
        .md-body ul, .md-body ol { margin: 10px 0 10px 24px; }
        .md-body li { margin: 4px 0; padding-left: 4px; }
        .md-body ul li { list-style: none; position: relative; }
        .md-body ul li::before { content: "▸"; position: absolute; left: -18px; color: #1e40af; font-weight: bold; }
        .md-body ol { list-style: decimal; }
        .md-body ol li::marker { color: #1e40af; font-weight: 700; }
        .md-body code.inline { background: #f1f5f9; color: #be123c; padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; border: 1px solid #e2e8f0; }
        .md-body pre.block { background: #0f172a; color: #e2e8f0; padding: 16px 20px; border-radius: 8px; overflow-x: auto; margin: 14px 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.6; border-left: 4px solid #22d3ee; }
        .md-body blockquote { border-left: 4px solid #94a3b8; padding: 8px 16px; margin: 12px 0; background: #f8fafc; color: #475569; font-style: italic; }
        .md-body hr { border: none; border-top: 2px dashed #cbd5e1; margin: 20px 0; }
        .md-body .checkbox-checked { color: #16a34a; font-weight: bold; margin-right: 6px; }
        .md-body .checkbox-unchecked { color: #cbd5e1; margin-right: 6px; }
        .md-body table.md-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
        .md-body table.md-table th { background: #1e40af; color: white; padding: 10px; text-align: left; font-weight: 700; }
        .md-body table.md-table td { border: 1px solid #e2e8f0; padding: 8px 10px; }
        .md-body table.md-table tr:nth-child(even) td { background: #f8fafc; }

        /* ═══ Document Themes (일반 문서용 컬러 팔레트) ═══ */
        .document-canvas[data-theme="blue"] { --doc-accent: #1e40af; --doc-accent-2: #3b82f6; --doc-heading: #0f172a; --doc-body-font: 'Crimson Pro', serif; }
        .document-canvas[data-theme="sepia"] { --doc-accent: #92400e; --doc-accent-2: #d97706; --doc-heading: #451a03; --doc-body-font: 'Crimson Pro', serif; background: #fdf8f0; }
        .document-canvas[data-theme="mono"] { --doc-accent: #1f2937; --doc-accent-2: #6b7280; --doc-heading: #000000; --doc-body-font: 'JetBrains Mono', monospace; }
        .document-canvas[data-theme="coral"] { --doc-accent: #be185d; --doc-accent-2: #ec4899; --doc-heading: #831843; --doc-body-font: 'Crimson Pro', serif; }
        /* Theme-aware header/accent overrides */
        .document-canvas[data-theme] .theme-h { color: var(--doc-heading) !important; }
        .document-canvas[data-theme] .theme-accent-bar { background: var(--doc-accent) !important; }
        .document-canvas[data-theme] .theme-accent-text { color: var(--doc-accent) !important; }
        .document-canvas[data-theme] .theme-accent-border { border-color: var(--doc-accent) !important; }
        .document-canvas[data-theme] .md-body h1 { color: var(--doc-heading); border-bottom-color: var(--doc-accent); }
        .document-canvas[data-theme] .md-body h2 { color: var(--doc-accent); border-left-color: var(--doc-accent); }
        .document-canvas[data-theme] .md-body h3 { color: var(--doc-accent); }
        .document-canvas[data-theme] .md-body ul li::before { color: var(--doc-accent); }
        .document-canvas[data-theme] .md-body ol li::marker { color: var(--doc-accent); }
        .document-canvas[data-theme] .md-body table.md-table th { background: var(--doc-accent); }
        .document-canvas[data-theme] .md-body pre.block { border-left-color: var(--doc-accent-2); }
        .document-canvas[data-theme="mono"] .md-body { font-family: 'JetBrains Mono', monospace; }
        .document-canvas[data-theme="sepia"] .md-body { color: #451a03; }

        /* ═══ Watermark ═══ */
        .watermark-wrap { position: relative; }
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-family: 'Archivo Black', sans-serif;
            font-size: 140px;
            font-weight: 900;
            letter-spacing: 0.08em;
            pointer-events: none;
            user-select: none;
            opacity: 0.10;
            white-space: nowrap;
            z-index: 100;
            text-shadow: 0 0 4px currentColor;
        }
        .watermark.wm-draft       { color: #f59e0b; }
        .watermark.wm-confidential{ color: #dc2626; opacity: 0.13; font-size: 110px; }
        .watermark.wm-approved    { color: #16a34a; }
        .watermark.wm-copy        { color: #6b7280; }
        .watermark.wm-final       { color: #1e40af; }

        /* ═══ QR Code container ═══ */
        .qr-block { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .qr-block img, .qr-block canvas { width: 64px; height: 64px; border: 1px solid #e5e7eb; padding: 2px; background: white; border-radius: 4px; }

        @media print {
            .watermark { opacity: 0.12 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback, useReducer } = React;

        // ═══════════════════════════════════════════════════════════════
        // 🎯 CONSTANTS & CONFIGURATION
        // ═══════════════════════════════════════════════════════════════
