        const STORAGE_KEY = 'prodoc_documents_v3';
        const SETTINGS_KEY = 'prodoc_settings_v3';
        const AUTOSAVE_INTERVAL = 1500;

        const WATERMARKS = ['NONE', 'DRAFT', 'CONFIDENTIAL', 'APPROVED', 'INTERNAL ONLY', 'COPY'];

        const useLocalStorage = (key, initialValue) => {
            const [stored, setStored] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (e) { return initialValue; }
            });
            const setValue = useCallback((value) => {
                try {
                    const v = value instanceof Function ? value(stored) : value;
                    setStored(v);
                    window.localStorage.setItem(key, JSON.stringify(v));
                } catch (e) { console.error(e); }
            }, [key, stored]);
            return [stored, setValue];
        };

        const useAutoSave = (data, callback, delay = AUTOSAVE_INTERVAL) => {
            useEffect(() => {
                const t = setTimeout(() => callback(data), delay);
                return () => clearTimeout(t);

        };

        // Inline markdown
        const parseInline = (str) => {
            const out = [];
            let key = 0;
            let s = str;
            const patterns = [
                { re: /\*\*(.+?)\*\*/, render: (m) => <strong key={key++}>{m[1]}</strong> },
                { re: /__(.+?)__/, render: (m) => <strong key={key++}>{m[1]}</strong> },
                { re: /\*(.+?)\*/, render: (m) => <em key={key++}>{m[1]}</em> },
                { re: /`([^`]+)`/, render: (m) => <code key={key++} className="inline">{m[1]}</code> },
                { re: /\[([^\]]+)\]\(([^)]+)\)/, render: (m) => <a key={key++} href={m[2]} target="_blank" rel="noreferrer">{m[1]}</a> },
                { re: /~~(.+?)~~/, render: (m) => <del key={key++}>{m[1]}</del> },
            ];
            while (s.length > 0) {
                let earliest = null;
                for (const p of patterns) {
                    const m = s.match(p.re);
                    if (m && (!earliest || m.index < earliest.match.index)) {
                        earliest = { match: m, pattern: p };
                    }
                }
                if (!earliest) { out.push(s); break; }
                if (earliest.match.index > 0) out.push(s.substring(0, earliest.match.index));
                out.push(earliest.pattern.render(earliest.match));
                s = s.substring(earliest.match.index + earliest.match[0].length);
            }
            return out;
        };

        const parseTable = (lines, start) => {
            const tableLines = [];
            let i = start;
            while (i < lines.length && lines[i].trim().includes('|') && (lines[i].match(/\|/g) || []).length >= 2) {
                tableLines.push(lines[i].trim());
                i++;
            }
            if (tableLines.length < 2) return null;
            const headers = tableLines[0].split('|').map(c => c.trim()).filter(Boolean);
            let rowStart = 1;
            if (tableLines[1] && /^[\s|:\-]+$/.test(tableLines[1])) rowStart = 2;
            const rows = tableLines.slice(rowStart).map(r => r.split('|').map(c => c.trim()).filter(Boolean)).filter(r => r.length > 0);
            return { headers, rows, end: i };
        };

        const renderMarkdown = (text) => {
            if (!text) return null;
            const lines = text.split('\n');
            const out = [];
            let i = 0;
            let key = 0;
            while (i < lines.length) {
                const line = lines[i];
                const trimmed = line.trim();

                if (!trimmed) { out.push(<div key={key++} style={{ height: '0.4rem' }} />); i++; continue; }

                if (trimmed.startsWith('```')) {
                    const codeLines = [];
                    i++;
                    while (i < lines.length && !lines[i].trim().startsWith('```')) { codeLines.push(lines[i]); i++; }
                    i++;
                    out.push(<pre key={key++}><code>{codeLines.join('\n')}</code></pre>);
                    continue;
                }

                if (/^#### /.test(trimmed)) { out.push(<h4 key={key++}>{parseInline(trimmed.substring(5))}</h4>); i++; continue; }
                if (/^### /.test(trimmed)) { out.push(<h3 key={key++}>{parseInline(trimmed.substring(4))}</h3>); i++; continue; }
                if (/^## /.test(trimmed)) { out.push(<h2 key={key++}>{parseInline(trimmed.substring(3))}</h2>); i++; continue; }
                if (/^# /.test(trimmed)) { out.push(<h1 key={key++}>{parseInline(trimmed.substring(2))}</h1>); i++; continue; }

                if (trimmed === '---' || trimmed === '***' || trimmed === '___') {
                    out.push(<hr key={key++} />); i++; continue;
                }

                if (trimmed.startsWith('> ')) {
                    const qs = [];
                    while (i < lines.length && lines[i].trim().startsWith('> ')) {
                        qs.push(lines[i].trim().substring(2));
                        i++;
                    }
                    out.push(<blockquote key={key++}>{qs.map((q, idx) => <div key={idx}>{parseInline(q)}</div>)}</blockquote>);
                    continue;
                }

                if (trimmed.includes('|') && (trimmed.match(/\|/g) || []).length >= 2) {
                    const tbl = parseTable(lines, i);
                    if (tbl && tbl.headers.length > 1) {
                        out.push(
                            <table key={key++}>
                                <thead><tr>{tbl.headers.map((h, idx) => <th key={idx}>{parseInline(h)}</th>)}</tr></thead>
                                <tbody>{tbl.rows.map((r, idx) => (
                                    <tr key={idx}>{r.map((c, j) => <td key={j}>{parseInline(c)}</td>)}</tr>
                                ))}</tbody>
                            </table>
                        );
                        i = tbl.end;
                        continue;
                    }
                }

                if (/^- \[[ x]\]/.test(trimmed)) {
                    const items = [];
                    while (i < lines.length && /^- \[[ x]\]/.test(lines[i].trim())) {
                        const ck = lines[i].trim();
                        const checked = ck.startsWith('- [x]');
                        items.push({ checked, text: ck.substring(5).trim() });
                        i++;
                    }
                    out.push(
                        <ul key={key++} style={{ listStyle: 'none', paddingLeft: '1rem' }}>
                            {items.map((it, idx) => (
                                <li key={idx} style={{ display: 'flex', alignItems: 'flex-start', gap: '0.5rem' }}>
                                    <input type="checkbox" checked={it.checked} readOnly style={{ marginTop: '0.4rem' }} />
                                    <span style={{ textDecoration: it.checked ? 'line-through' : 'none', color: it.checked ? '#9ca3af' : 'inherit' }}>{parseInline(it.text)}</span>
                                </li>
                            ))}
                        </ul>
                    );
                    continue;
                }

                if (/^[-*] /.test(trimmed)) {
                    const items = [];
                    while (i < lines.length && /^[-*] /.test(lines[i].trim())) {
                        items.push(lines[i].trim().substring(2));
                        i++;
                    }
                    out.push(<ul key={key++}>{items.map((it, idx) => <li key={idx}>{parseInline(it)}</li>)}</ul>);
                    continue;
                }

                if (/^\d+\.\s/.test(trimmed)) {
                    const items = [];
                    while (i < lines.length && /^\d+\.\s/.test(lines[i].trim())) {
                        items.push(lines[i].trim().replace(/^\d+\.\s/, ''));
                        i++;
                    }
                    out.push(<ol key={key++}>{items.map((it, idx) => <li key={idx}>{parseInline(it)}</li>)}</ol>);
                    continue;
                }

                out.push(<p key={key++}>{parseInline(line)}</p>);
                i++;
            }
            return <>{out}</>;
        };

        // Securities table parser
        const parseSecuritiesTable = (text) => {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const tables = [];
            let i = 0;
            while (i < lines.length) {
                const line = lines[i];
                if (line.includes('|') && (line.match(/\|/g) || []).length >= 3) {
                    let j = i;
                    const tableLines = [];
                    while (j < lines.length) {
                        const l = lines[j];
                        if (l.includes('|') && (l.match(/\|/g) || []).length >= 3) {
                            tableLines.push(l);
                            j++;
                        } else break;
                    }
                    if (tableLines.length >= 2) {
                        let headers = tableLines[0].split('|').map(c => c.trim()).filter(Boolean);
                        let rowStart = 1;
                        if (tableLines[1] && tableLines[1].match(/^[\s|:-]+$/)) rowStart = 2;
                        const rows = tableLines.slice(rowStart).map(row =>
                            row.split('|').map(c => c.trim()).filter(Boolean)
                        ).filter(row => row.length > 0 && row.length === headers.length);
                        if (headers.length > 0) tables.push({ headers, rows });
                    }
                    i = j;
                    continue;
                }
                i++;
            }
            return tables;
        };

            const allValues = series.flatMap(s => s.values);
            const max = Math.max(...allValues, 1);
            const W = 540, H = 220, P = 36;
            const groupW = (W - 2 * P) / numCols;
            const colors = ['#dc2626', '#3b82f6', '#10b981'];
            return (
                <div style={{ margin: '1rem 0', padding: '1rem', background: '#f9fafb', borderRadius: 8, border: '1px solid #e5e7eb' }}>

                        ))}
                        {labels.map((lab, i) => {

                        })}

                            const barW = Math.max(8, (groupW - 16) / series.length - 2);

                                        {v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v.toFixed(0)}
                                    </text>
                                </g>;
                            });
                        })}
                        <line x1={P} x2={W - P} y1={H - P} y2={H - P} stroke="#9ca3af" strokeWidth="1.5" />
                        <line x1={P} x2={P} y1={P} y2={H - P} stroke="#9ca3af" strokeWidth="1.5" />
                    </svg>
                    <div style={{ display: 'flex', gap: '1rem', marginTop: '0.5rem', justifyContent: 'center', flexWrap: 'wrap' }}>
                        {series.map((s, i) => (
                            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: '0.7rem', color: '#374151' }}>
                                <span style={{ width: 12, height: 12, background: colors[i], borderRadius: 2, display: 'inline-block' }} />
                                <span style={{ fontFamily: 'JetBrains Mono' }}>{s.name}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SecuritiesContentRenderer = ({ content }) => {

                case actions.CREATE: {
                    const doc = buildNewDoc(action.payload.templateId, action.payload.initialData);
                    return { ...state, documents: [...state.documents, doc], currentDocId: doc.id };
                }
                case actions.UPDATE:
                    return {
                        ...state,
                        documents: state.documents.map(d =>
                            d.id === action.payload.id
                                ? { ...d, data: { ...d.data, ...action.payload.updates }, updatedAt: new Date().toISOString() }
                                : d
                        ),
                        lastSaved: new Date()
                    };
                case actions.DELETE: {
                    const remaining = state.documents.filter(d => d.id !== action.payload.id);
                    return { ...state, documents: remaining, currentDocId: remaining[0]?.id || null };
                }
                case actions.SELECT:
                    return { ...state, currentDocId: action.payload.id };
                case actions.LOAD:
                    return {
                        ...state,
                        documents: action.payload.documents,
                        currentDocId: action.payload.documents[0]?.id || null
                    };
                case actions.TOGGLE_PIN:
                    return {
                        ...state,
                        documents: state.documents.map(d =>
                            d.id === action.payload.id ? { ...d, pinned: !d.pinned } : d
                        )
                    };
                case actions.DUPLICATE: {
                    const orig = state.documents.find(d => d.id === action.payload.id);
                    if (!orig) return state;
                    const copy = {
                        ...orig,
                        id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
                        pinned: false,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        data: { ...orig.data, title: orig.data.title + ' (사본)' }
                    };
                    return { ...state, documents: [...state.documents, copy], currentDocId: copy.id };
                }
                case actions.BULK_LOAD: {
                    const merged = [...state.documents, ...action.payload.documents];
                    return { ...state, documents: merged, currentDocId: action.payload.documents[0]?.id || state.currentDocId };
                }

                    filename: `${currentDoc.data.title || 'document'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(printRef.current).save().then(() => {
                    setToast('🎉 PDF 다운로드 완료');
                }).catch(() => setToast('❌ PDF 생성 오류'));
            }, [currentDoc]);

            const exportJSON = useCallback(() => {
                const blob = new Blob([JSON.stringify(state.documents, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `prodoc-export-${Date.now()}.json`;
                a.click();
                setToast('📦 JSON 백업 다운로드 완료');
            }, [state.documents]);

            const importJSON = useCallback((file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        const docs = Array.isArray(parsed) ? parsed : [parsed];
                        const valid = docs.filter(d => d.templateId && TEMPLATES[d.templateId] && d.data);
                        if (valid.length === 0) { setToast('⚠️ 유효한 문서가 없습니다'); return; }
                        dispatch({ type: actions.BULK_LOAD, payload: { documents: valid } });
                        setToast(`📥 ${valid.length}개 문서 가져옴`);
                    } catch (err) {
                        setToast('❌ JSON 파싱 오류');
                    }
                };
                reader.readAsText(file);
            }, []);

            const exportTXT = useCallback(() => {
                const text = `${currentDoc.data.title}\n${'='.repeat(40)}\n\n${currentDoc.data.content}`;
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentDoc.data.title || 'document'}.txt`;
                a.click();
                setToast('📝 TXT 다운로드 완료');
            }, [currentDoc]);

            const exportMD = useCallback(() => {
                const text = `# ${currentDoc.data.title}\n\n${currentDoc.data.content}`;
                const blob = new Blob([text], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentDoc.data.title || 'document'}.md`;
                a.click();
                setToast('📄 Markdown 다운로드 완료');
            }, [currentDoc]);

            const renderSeal = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                canvas.width = 200 * dpr;
                canvas.height = 200 * dpr;
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, 200, 200);
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(100, 100, 78, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(100, 100, 68, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(100, 100, 55, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#dc2626';
                ctx.textAlign = 'center';
                ctx.font = 'bold 14px JetBrains Mono';
                ctx.fillText('DIRECTOR', 100, 78);
                ctx.font = 'bold 32px serif';
                ctx.fillText('임채훈', 100, 118);
                ctx.font = 'bold 12px JetBrains Mono';
                ctx.fillText('印', 100, 140);
            }, []);

            useEffect(() => { renderSeal(); }, [renderSeal, currentDoc]);

            useEffect(() => {
                const handler = (e) => {
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const mod = isMac ? e.metaKey : e.ctrlKey;
                    if (mod && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        setPaletteOpen(p => !p);
                    } else if (mod && e.key.toLowerCase() === 's') {
                        e.preventDefault();
                        setSavedDocs(state.documents);
                        setToast('💾 저장 완료');
                    } else if (mod && e.key.toLowerCase() === 'p') {
                        e.preventDefault();
                        window.print();
                    } else if (mod && e.key === '=') {
                        e.preventDefault();
                        setSettings(s => ({ ...s, zoom: Math.min(2, s.zoom + 0.1) }));
                    } else if (mod && e.key === '-') {
                        e.preventDefault();
                        setSettings(s => ({ ...s, zoom: Math.max(0.4, s.zoom - 0.1) }));
                    } else if (mod && e.key === '0') {
                        e.preventDefault();
                        setSettings(s => ({ ...s, zoom: 0.7 }));
                    }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [state.documents]);

            const visibleDocs = useMemo(() => {
                let docs = state.documents;
                if (settings.filterTab === 'pinned') docs = docs.filter(d => d.pinned);
                else if (settings.filterTab === 'securities') docs = docs.filter(d => TEMPLATES[d.templateId]?.isSecurities);
                else if (settings.filterTab === 'business') docs = docs.filter(d => TEMPLATES[d.templateId]?.category === 'business');
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    docs = docs.filter(d =>
                        (d.data.title || '').toLowerCase().includes(q) ||
                        (d.data.content || '').toLowerCase().includes(q) ||
                        TEMPLATES[d.templateId].name.toLowerCase().includes(q)
                    );
                }
                if (settings.sortBy === 'recent') docs = [...docs].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                else if (settings.sortBy === 'name') docs = [...docs].sort((a, b) => (a.data.title || '').localeCompare(b.data.title || ''));
                else if (settings.sortBy === 'created') docs = [...docs].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                docs = [...docs].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
                return docs;
            }, [state.documents, settings.filterTab, settings.sortBy, searchQuery]);

            const commands = useMemo(() => {
                const cmds = [];
                Object.entries(TEMPLATES).forEach(([key, tmpl]) => {
                    cmds.push({
                        id: `new-${key}`,
                        section: '새 문서',
                        icon: tmpl.icon,
                        label: `생성: ${tmpl.name}`,
                        hint: tmpl.category,
                        action: () => createNewDocument(key)
                    });
                });
                state.documents.forEach(d => {
                    cmds.push({
                        id: `open-${d.id}`,
                        section: '문서 열기',
                        icon: TEMPLATES[d.templateId].icon,
                        label: d.data.title || '(제목 없음)',
                        hint: TEMPLATES[d.templateId].name,
                        action: () => dispatch({ type: actions.SELECT, payload: { id: d.id } })
                    });
                });
                cmds.push(
                    { id: 'export-pdf', section: '액션', icon: '📄', label: 'PDF 내보내기', action: exportToPDF },
                    { id: 'export-md', section: '액션', icon: '📝', label: 'Markdown 내보내기', action: exportMD },
                    { id: 'export-txt', section: '액션', icon: '📋', label: 'TXT 내보내기', action: exportTXT },
                    { id: 'export-json', section: '액션', icon: '📦', label: 'JSON 백업 내보내기', action: exportJSON },
                    { id: 'import-json', section: '액션', icon: '📥', label: 'JSON 가져오기', action: () => fileInputRef.current?.click() },
                    { id: 'save', section: '액션', icon: '💾', label: '저장', shortcut: '⌘S', action: () => { setSavedDocs(state.documents); setToast('💾 저장 완료'); } },
                    { id: 'print', section: '액션', icon: '🖨️', label: '인쇄', shortcut: '⌘P', action: () => window.print() }
                );
                if (currentDoc) {
                    cmds.push(
                        { id: 'duplicate', section: '액션', icon: '📑', label: '현재 문서 복제', action: () => duplicateDocument(currentDoc.id) },
                        { id: 'pin', section: '액션', icon: currentDoc.pinned ? '📌' : '⭐', label: currentDoc.pinned ? '핀 해제' : '핀 고정', action: () => togglePin(currentDoc.id) },
                        { id: 'delete', section: '액션', icon: '🗑️', label: '현재 문서 삭제', action: () => deleteDocument(currentDoc.id) }
                    );
                }
                THEMES.forEach(t => {
                    cmds.push({
                        id: `theme-${t}`,
                        section: '테마',
                        icon: '🎨',
                        label: `테마: ${t.toUpperCase()}`,
                        action: () => setSettings(s => ({ ...s, theme: t }))
                    });
                });
                WATERMARKS.forEach(w => {
                    cmds.push({
                        id: `wm-${w}`,
                        section: '워터마크',
                        icon: '🏷️',
                        label: `워터마크: ${w}`,
                        action: () => setSettings(s => ({ ...s, watermark: w }))
                    });
                });
                return cmds;
            }, [state.documents, currentDoc, exportToPDF, exportMD, exportTXT, exportJSON, createNewDocument, duplicateDocument, deleteDocument, togglePin, setSettings, setSavedDocs]);

            if (!currentDoc) {
                return (
                    <div className="flex items-center justify-center h-screen">
                        <div className="text-center">
                            <div className="text-6xl mb-4">📄</div>
                            <p className="text-gray-400">문서를 생성하세요</p>
                        </div>
                    </div>
                );
            }

            const isCollapsed = settings.sidebarCollapsed;

            return (
                <div className="flex h-screen w-full overflow-hidden grid-bg">
                    <input
                        ref={fileInputRef}
                        type="file"
                        accept="application/json"
                        style={{ display: 'none' }}
                        onChange={(e) => {
                            const f = e.target.files?.[0];
                            if (f) importJSON(f);
                            e.target.value = '';
                        }}
                    />

                    <aside
                        className="bg-[#0a0e14] border-r flex flex-col transition-all duration-300 no-print"
                        style={{
                            width: isCollapsed ? '60px' : '420px',
                            borderColor: 'var(--accent-border)'
                        }}
                    >
                        <div className="p-5 border-b" style={{ borderColor: 'var(--accent-border)' }}>
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-3 h-3 rounded-full status-indicator" style={{ background: 'var(--accent)' }} />
                                    {!isCollapsed && (
                                        <div>
                                            <h1 className="font-black tracking-tight display text-lg" style={{ color: 'var(--accent)' }}>PRODOC</h1>
                                            <p className="text-[9px] text-gray-500 mono">Enterprise v3.0</p>
                                        </div>
                                    )}
                                </div>
                                <button
                                    onClick={() => setSettings(s => ({ ...s, sidebarCollapsed: !s.sidebarCollapsed }))}
                                    className="text-gray-400 hover:text-white transition-colors text-lg"
                                >
                                    {isCollapsed ? '→' : '←'}
                                </button>
                            </div>
                            {!isCollapsed && (
                                <button
                                    onClick={() => setPaletteOpen(true)}
                                    className="w-full bg-[#151b24] hover:bg-[#1f2937] text-gray-400 hover:text-gray-200 rounded-lg px-3 py-2 text-xs mono flex items-center justify-between transition-all"
                                    style={{ border: '1px solid var(--accent-border)' }}
                                >
                                    <span className="flex items-center gap-2">
                                        <span>🔍</span>
                                        <span>명령 검색...</span>
                                    </span>
                                    <span className="kbd">⌘K</span>
                                </button>
                            )}
                        </div>

                        {!isCollapsed && (
                            <>
                                <div className="px-4 pt-3 pb-2">
                                    <input
                                        className="w-full bg-[#151b24] rounded-lg px-3 py-2 text-xs text-gray-200 mono outline-none"
                                        style={{ border: '1px solid var(--accent-border)' }}
                                        placeholder="🔎 문서 검색..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        onFocus={(e) => e.target.style.borderColor = 'var(--accent)'}
                                        onBlur={(e) => e.target.style.borderColor = 'var(--accent-border)'}
                                    />
                                </div>

                                <div className="px-4 pb-2 flex items-center gap-1 flex-wrap">
                                    {[
                                        { k: 'all', label: '전체' },
                                        { k: 'pinned', label: '★ 핀' },
                                        { k: 'business', label: '비즈니스' },
                                        { k: 'securities', label: '증권' }
                                    ].map(t => (
                                        <button
                                            key={t.k}
                                            className={`tab-btn ${settings.filterTab === t.k ? 'active' : ''}`}
                                            onClick={() => setSettings(s => ({ ...s, filterTab: t.k }))}
                                        >{t.label}</button>
                                    ))}
                                </div>

                                <div className="px-3 pb-2 border-b" style={{ borderColor: 'var(--accent-border)' }}>
                                    <div className="flex items-center justify-between px-2 mb-1">
                                        <p className="text-[9px] font-bold text-gray-500 uppercase tracking-wider mono">
                                            문서 ({visibleDocs.length}/{state.documents.length})
                                        </p>
                                        <select
                                            className="bg-transparent text-[9px] text-gray-500 mono outline-none cursor-pointer"
                                            value={settings.sortBy}
                                            onChange={(e) => setSettings(s => ({ ...s, sortBy: e.target.value }))}
                                        >
                                            <option value="recent" style={{ background: '#151b24' }}>최근 수정순</option>
                                            <option value="name" style={{ background: '#151b24' }}>이름순</option>
                                            <option value="created" style={{ background: '#151b24' }}>생성일순</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1 max-h-[180px] overflow-y-auto">
                                        {visibleDocs.length === 0 && (
                                            <div className="text-center py-4 text-[10px] text-gray-500 mono">매칭되는 문서 없음</div>
                                        )}
                                        {visibleDocs.map((doc) => (
                                            <div
                                                key={doc.id}
                                                className="group flex items-center gap-2 p-2 rounded-lg cursor-pointer transition-all"
                                                style={{
                                                    background: doc.id === currentDoc.id ? 'var(--accent-soft)' : 'transparent',
                                                    border: doc.id === currentDoc.id ? '1px solid var(--accent-border)' : '1px solid transparent'
                                                }}
                                                onClick={() => dispatch({ type: actions.SELECT, payload: { id: doc.id } })}
                                                onMouseEnter={(e) => { if (doc.id !== currentDoc.id) e.currentTarget.style.background = '#151b24'; }}
                                                onMouseLeave={(e) => { if (doc.id !== currentDoc.id) e.currentTarget.style.background = 'transparent'; }}
                                            >
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); togglePin(doc.id); }}
                                                    className="star-btn text-sm"
                                                    style={{ color: doc.pinned ? 'var(--accent)' : '#374151', background: 'none', border: 'none' }}
                                                    title={doc.pinned ? '핀 해제' : '핀 고정'}
                                                >★</button>
                                                <span className="text-base">{TEMPLATES[doc.templateId].icon}</span>
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-xs text-gray-200 mono truncate">{doc.data.title}</p>
                                                    <p className="text-[9px] text-gray-500 mono">
                                                        {TEMPLATES[doc.templateId].name} · {new Date(doc.updatedAt).toLocaleDateString('ko-KR')}
                                                    </p>
                                                </div>
                                                <div className="opacity-0 group-hover:opacity-100 transition-opacity flex gap-1">
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); duplicateDocument(doc.id); }}
                                                        className="text-gray-500 hover:text-gray-200 text-xs"
                                                        title="복제"
                                                        style={{ background: 'none', border: 'none', cursor: 'pointer' }}
                                                    >⎘</button>
                                                    {state.documents.length > 1 && (
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); deleteDocument(doc.id); }}
                                                            className="text-gray-500 hover:text-red-400 text-xs"
                                                            title="삭제"
                                                            style={{ background: 'none', border: 'none', cursor: 'pointer' }}
                                                        >✕</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4">
                                    <div className="gradient-border rounded-lg p-3 mb-4">
                                        <p className="text-[10px] font-bold mono mb-1" style={{ color: 'var(--accent)' }}>
                                            {currentTemplate?.icon} {currentTemplate?.name}
                                        </p>
                                        <p className="text-[9px] text-gray-500 mono uppercase tracking-wider">
                                            {currentTemplate?.category}
                                        </p>
                                    </div>

                                    {currentTemplate?.isSecurities ? (
                                        <>
                                            <FieldInput label="기업명" value={currentDoc.data.company || ''} onChange={(v) => updateField('company', v)} placeholder="예: 삼성전자" />
                                            <FieldInput label="리포트 제목" value={currentDoc.data.title || ''} onChange={(v) => updateField('title', v)} />
                                            <div className="grid grid-cols-2 gap-2">
                                                <FieldInput label="투자의견" value={currentDoc.data.rating || ''} onChange={(v) => updateField('rating', v)} placeholder="BUY/HOLD/SELL" />
                                                <FieldInput label="목표주가" value={currentDoc.data.target_price || ''} onChange={(v) => updateField('target_price', v)} />
                                            </div>
                                            <FieldInput label="현재주가" value={currentDoc.data.current_price || ''} onChange={(v) => updateField('current_price', v)} />
                                            <FieldInput label="분석 내용 (Markdown)" type="textarea" value={currentDoc.data.content || ''} onChange={(v) => updateField('content', v)} />
                                            <FieldInput label="애널리스트" value={currentDoc.data.author || ''} onChange={(v) => updateField('author', v)} />
                                        </>
                                    ) : (
                                        <>
                                            <FieldInput label="조직/기관명" value={currentDoc.data.organization || ''} onChange={(v) => updateField('organization', v)} />
                                            <FieldInput label="수신자" value={currentDoc.data.recipient || ''} onChange={(v) => updateField('recipient', v)} />
                                            <FieldInput label="문서 제목" value={currentDoc.data.title || ''} onChange={(v) => updateField('title', v)} />
                                            <FieldInput label="본문 (Markdown 지원)" type="textarea" value={currentDoc.data.content || ''} onChange={(v) => updateField('content', v)} />
                                            <FieldInput label="발신자 (서명)" value={currentDoc.data.author || ''} onChange={(v) => updateField('author', v)} />
                                        </>
                                    )}
                                </div>
                            </>
                        )}
                    </aside>

                    <main className="flex-1 bg-[#0d1117] overflow-hidden flex flex-col print-area">
                        <div className="flex items-center gap-2 px-4 py-2 bg-[#0a0e14] border-b no-print" style={{ borderColor: 'var(--accent-border)' }}>
                            <button className="tool-btn primary" onClick={exportToPDF}>📄 PDF</button>
                            <button className="tool-btn" onClick={() => window.print()}>🖨️ Print</button>
                            <button className="tool-btn" onClick={exportMD}>📝 MD</button>
                            <button className="tool-btn" onClick={exportTXT}>📋 TXT</button>
                            <button className="tool-btn" onClick={exportJSON}>📦 JSON</button>
                            <button className="tool-btn" onClick={() => fileInputRef.current?.click()}>📥 Import</button>

                            <div className="flex-1" />

                            <select
                                className="tool-btn"
                                value={settings.watermark}
                                onChange={(e) => setSettings(s => ({ ...s, watermark: e.target.value }))}
                                title="워터마크"
                            >
                                {WATERMARKS.map(w => (
                                    <option key={w} value={w} style={{ background: '#151b24' }}>🏷️ {w}</option>
                                ))}
                            </select>

                            <div className="flex items-center gap-1 tool-btn" style={{ padding: '4px 8px' }}>
                                <button
                                    onClick={() => setSettings(s => ({ ...s, zoom: Math.max(0.4, s.zoom - 0.1) }))}
                                    style={{ padding: '0 6px', background: 'none', border: 'none', color: 'inherit', cursor: 'pointer' }}
                                >−</button>
                                <span className="text-[11px] mono w-10 text-center">{Math.round(settings.zoom * 100)}%</span>
                                <button
                                    onClick={() => setSettings(s => ({ ...s, zoom: Math.min(2, s.zoom + 0.1) }))}
                                    style={{ padding: '0 6px', background: 'none', border: 'none', color: 'inherit', cursor: 'pointer' }}
                                >+</button>
                            </div>

                            <button className="tool-btn" onClick={() => setPaletteOpen(true)} title="명령 팔레트">
                                ⌘K
                            </button>
                        </div>

                        <div className="flex-1 overflow-auto flex justify-center items-start p-8" style={{ background: '#0d1117' }}>
                            <div className="doc-zoom-wrap" style={{ transform: `scale(${settings.zoom})` }}>
                                <div ref={printRef}>
                                    {currentTemplate?.isSecurities ? (
                                        <SecuritiesDocument doc={currentDoc} watermark={settings.watermark} />
                                    ) : (
                                        <GeneralDocument doc={currentDoc} template={currentTemplate} canvasRef={canvasRef} watermark={settings.watermark} />
                                    )}
                                </div>
                            </div>
                        </div>

                        <StatusBar
                            stats={stats}
                            lastSaved={state.lastSaved}
                            zoom={settings.zoom}
                            theme={settings.theme}
                            onThemeChange={(t) => setSettings(s => ({ ...s, theme: t }))}
                        />
                    </main>

                    <CommandPalette
                        open={paletteOpen}
                        onClose={() => setPaletteOpen(false)}
                        commands={commands}
                    />

                    {toast && <Toast message={toast} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProDocEngine />);
    </script>
</body>
</html>
